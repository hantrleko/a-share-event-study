name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check src tests app
      - name: Tests
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -s tests -v
